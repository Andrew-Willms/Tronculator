[package]
name = "tronculator"
version = "0.1.0"
edition = "2024"
description = "A calculator for all things mechatronics."
repository = "https://github.com/Andrew-Willms/Tronculator"
license-file = "../LICENSE"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = [
    "Document",
    "DomRect",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }

console_error_panic_hook = { version = "0.1.7", optional = true }
console_log = { version = "1.1.0", optional = true }
log = "0.4.34"

[features]
debug-logging = [
    "dep:console_error_panic_hook",
    "dep:console_log",
]